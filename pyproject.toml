[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-router-gateway"
version = "0.1.0"
description = "LLM router gateway fronting the Hooshyar OpenAI-compatible API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["gateway*", "policies*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
